# ─────────────────────────────────────────────────────────────────────────────
# therapy_ai / config / default_config.yaml
#
# All runtime configuration lives here.
# To switch model: change model_id. No code changes needed.
# ─────────────────────────────────────────────────────────────────────────────

model:
  # ── Model selection ──────────────────────────────────────────────────────
  # Mac (MLX): mlx-community models are quantised for Apple Silicon only.
  # NVIDIA / CPU: use a standard HuggingFace model ID instead (see below).
  #
  # Mac (M4 16 GB, default):
  model_id: "mlx-community/Meta-Llama-3.1-8B-Instruct-4bit"
  # Mac alternative:      "mlx-community/Qwen2.5-7B-Instruct-4bit"
  #
  # NVIDIA / CPU — uncomment one of these and set quantization: "q4_k_m":
  # model_id: "Qwen/Qwen2.5-7B-Instruct"
  # model_id: "meta-llama/Meta-Llama-3.1-8B-Instruct"   # requires HF token

  # Quantisation: q4_k_m | q8_0 | f16 | none
  # q4_k_m = ~5 GB on disk, best quality-per-byte
  # quantization: "q4_k_m"
  quantization: "4bit"  # MLX-specific; ignored for llama.cpp

  # Context window. 4096 is safe for M4 16GB + Qwen3 8B Q4
  # max_seq_length: 4096
  max_seq_length: 8192  # Llama3.1 supports it

  # dtype: null = auto (bfloat16 on M-series and Ampere+)
  dtype: null

  # QLoRA 4-bit base on CUDA. Ignored on MLX.
  load_in_4bit: true

  # Path to a trained LoRA adapter (null = base model only)
  adapter_path: null


inference:
  temperature: 0.75         # Higher = more creative, lower = more focused
  top_p: 0.90
  repetition_penalty: 1.10
  max_new_tokens: 512


storage:
  db_path: "data/sessions.db"
  salt_file: "data/.salt"
  finetune_dir: "data/finetune"
  adapters_dir: "data/adapters"


ui:
  locale: "EN"              # Used for localised emergency resources — change to your country code (e.g. DE, IT, FR)
  theme: "calm"             # calm | dark | light (future use)
  show_token_count: false
  # Auto-lock the workspace after this many minutes of inactivity.
  # 0 (default) disables inactivity locking. When triggered, the key is dropped,
  # the semantic index is cleared, and the passphrase must be re-entered.
  lock_timeout_minutes: 0


logging:
  level: "INFO"             # DEBUG | INFO | WARNING | ERROR
  log_file: "data/therapy_ai.log"


session_closing:
  # ── Automatic closing-ritual trigger ─────────────────────────────────────
  #
  # The model is nudged into closing mode when the session reaches
  # `auto_close_after_turns` user turns. A [CLOSING_MODE] marker is injected
  # into the context so the model follows the SESSION CLOSING protocol defined
  # in system_prompt.txt.
  #
  # Set auto_close_after_turns to 0 to disable automatic triggering entirely
  # (the user can still trigger closing manually via the "Wrap up" button).
  auto_close_after_turns: 20     # ~40–50 min at typical conversation pace

  # How many turns before the threshold to show the "Wrap up session" button.
  # e.g. with threshold=20 and warn_before=3, button appears at turn 17.
  warn_before_turns: 3

  # Whether to allow the user to manually trigger closing at any time via
  # a sidebar button, regardless of turn count.
  allow_manual_trigger: true

  # ── Timed-session wind-down ──────────────────────────────────────────────
  #
  # When the user chooses a session length (e.g. 3 / 15 / 30 / 50 min), the
  # closing ritual begins automatically as the time nears its end — mirroring
  # how a therapist gives a time warning in the last ~10–20% of a session.
  #
  # Closing starts at `time_close_at_fraction` of the chosen duration, but no
  # later than (duration - time_close_floor_seconds) so very short sessions
  # still get a sensible wind-down window. Whichever comes first wins.
  time_close_at_fraction: 0.80   # last 20% of the session
  time_close_floor_seconds: 30   # always leave >= 30s to wind down

  # ── Keyphrase intent ─────────────────────────────────────────────────────
  #
  # If the user signals they want to leave ("I have to go", "talk to you
  # soon"), the model's reply to that message begins the closing ritual.
  # Matching is case- and punctuation-insensitive. Set detect_keyphrases to
  # false to disable, or override `closing_phrases` to supply your own list
  # (replaces the built-in defaults entirely).
  detect_keyphrases: true
  # closing_phrases:
  #   - "i have to go"
  #   - "talk to you soon"
  #   - "that's all for today"
